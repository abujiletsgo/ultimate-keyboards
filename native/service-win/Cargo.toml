[package]
name = "ultimate-keyboards-remapper-win"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "uk_remapper_win"
path = "src/lib.rs"

[[bin]]
name = "ultimate-keyboards-remapper-win"
path = "src/main.rs"

[dependencies]
ultimate-keyboards-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
# Test-only: act on keys tagged by native/service-win/e2e. Never enable for the shipped installer.
e2e = []

[profile.release]
panic = "abort"
lto = true
