  - id: RECOVER-1
    area: laptop-keys
    check: 'When remapping is stopped or broken (after wake, a dropped link, an update that switched off Input Monitoring or the driver approval, a missing or failing helper, or an unreachable helper) a banner on every Keys tab names the problem in plain words and offers one button: Turn remapping back on, Open Input Monitoring settings (the banner re-checks when you return and has an I turned it on button), Approve keyboard driver, Install keyboard helper, Try turning on again, Restart keyboard service, or Check again; a failed fix shows its reason in the banner; nothing shows when remapping is running or you pressed Stop; a problem with no real fix (Windows service missing, unsupported Windows build, no rules) shows no button'
    targets: [host]
    how: 'auto: sh -c ''cd "$(git rev-parse --show-toplevel)" && bun test tests/nativeProblem.test.ts'''
    proof: 'bun prints 21 passed using the shapes the app really reports: a Mac helper that is down (error with Input Monitoring false) is unreachable, not a permission problem; the Mac sleep, dropped-link and reconnect stops and all three Windows stops (sleep, lock, app stalled, with the app note appended) show Turn remapping back on; Mac helper errors offer Try turning on again, Windows errors offer Restart keyboard service which runs the restart command, an unsupported Windows build has no button; each fix kind calls exactly one existing engine command; priority missing > unreachable > permission > driver > error > stopped. Not covered by the test: the banner component (held while a fix runs, failure text, re-check on window focus) is checked by type and build only, and the live wake, update and helper-down paths stay with HANDS-8 and KE-13'
    affects: [src/lib/nativeProblem.ts, src/components/KarabinerEditor/NativeFixBanner.tsx, src/lib/nativeRemapping.ts]
    added: 2026-11-17 KE-43 one-tap fixes after sleep or updates (banner rendered at 390/768/1100 px via a mocked helper; the live wake and update paths stay with HANDS-8 and KE-13)

