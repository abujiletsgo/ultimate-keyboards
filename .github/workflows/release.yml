name: Release
# Push a tag like v0.2.0 (matching tauri.conf.json "version") to build, sign the
# updater artifacts, and publish a GitHub Release with latest.json.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Tag matches app version
        run: |
          v=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != app version v$v"; exit 1; }
      - name: Release notes from CHANGELOG
        id: notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }
          { echo 'body<<UK_NOTES_EOF'; cat notes.md; echo 'UK_NOTES_EOF'; } >> "$GITHUB_OUTPUT"
      - name: Updater public key is set
        run: |
          python3 -c "import json,sys; k=json.load(open('src-tauri/tauri.conf.json'))['plugins']['updater']['pubkey']; sys.exit(0 if k else 'plugins.updater.pubkey is empty: run scripts/setup-updater-key.sh')"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Ultimate Keyboards ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # update archives + signatures only in CI, so local `bun run build` needs no key
          args: --target aarch64-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":true}}'
