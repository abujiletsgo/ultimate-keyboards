[package]
name = "ultimate-keyboards"
version = "0.1.0"
description = "Ultimate Keyboards — ZMK/QMK editor, Karabiner configurator, chord trainer"
authors = []
edition = "2021"

[[bin]]
name = "ultimate-keyboards"
path = "src/main.rs"

[lib]
name = "ultimate_keyboards_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
core-graphics = "0.24"
core-foundation = "0.10"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
