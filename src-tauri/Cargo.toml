[package]
name = "ultimate-keyboards"
version = "0.3.0"
description = "Ultimate Keyboards — ZMK/QMK keymap editor, pointing-device tuner, native Mac keyboard remapping"
authors = []
edition = "2021"

[[bin]]
name = "ultimate-keyboards"
path = "src/main.rs"

[lib]
name = "ultimate_keyboards_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-persisted-scope = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri-plugin-store = "2"
tauri-plugin-process = "2.3.1"
serialport = { version = "4.10.1", default-features = false }
lzma-rs = "0.3.0"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Only for frames.rs: the WKWebView frame-rate preference.
objc2 = "0.6"
# The scroll engine (mouse_engine.rs).
core-graphics = { version = "0.24", features = ["highsierra"] }
core-foundation = "0.10"
hidapi = { version = "2.6.7", default-features = false, features = ["macos-shared-device"] }
tauri-plugin-updater = "2.12.0"

[target.'cfg(windows)'.dependencies]
# ShellExecute for opening links (platform/windows.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Media", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# Pure-Rust HID backend: no C compiler needed, same on x64 and ARM64.
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
# Windows' own certificate store (schannel) instead of rustls + ring, which
# needs a C toolchain per CPU (x64 and ARM64).
tauri-plugin-updater = { version = "2.12.0", default-features = false, features = ["native-tls", "zip", "system-proxy"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
